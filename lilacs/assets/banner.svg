<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="340" viewBox="0 0 1200 340" role="img" aria-label="Lilacs, wallpaper animado">
  <defs>
    <filter id="blur" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="70"/></filter>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="14"/></filter>
    <filter id="glow" x="-20%" y="-40%" width="140%" height="180%">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <pattern id="scan" width="4" height="4" patternUnits="userSpaceOnUse"><rect width="4" height="1" fill="#000" opacity=".35"/></pattern>
    <radialGradient id="vig" cx="50%" cy="50%" r="75%">
      <stop offset="55%" stop-color="#05000f" stop-opacity="0"/><stop offset="100%" stop-color="#05000f" stop-opacity=".85"/>
    </radialGradient>
    <clipPath id="round"><rect width="1200" height="340" rx="22"/></clipPath>
  </defs>
  <g clip-path="url(#round)">
    <rect width="1200" height="340" fill="#07030f"/>
    <!-- as quatro cores do wallpaper -->
    <g filter="url(#blur)" opacity=".85">
      <circle r="190" fill="#ff3fb4" cx="180" cy="80"><animate attributeName="cx" values="180;420;180" dur="14s" repeatCount="indefinite"/><animate attributeName="cy" values="80;260;80" dur="11s" repeatCount="indefinite"/></circle>
      <circle r="200" fill="#9b5cff" cx="520" cy="300"><animate attributeName="cx" values="520;300;520" dur="16s" repeatCount="indefinite"/><animate attributeName="cy" values="300;120;300" dur="13s" repeatCount="indefinite"/></circle>
      <circle r="190" fill="#2e6bff" cx="820" cy="60"><animate attributeName="cx" values="820;1000;820" dur="15s" repeatCount="indefinite"/><animate attributeName="cy" values="60;250;60" dur="12s" repeatCount="indefinite"/></circle>
      <circle r="180" fill="#2ff3e0" cx="1080" cy="290"><animate attributeName="cx" values="1080;860;1080" dur="17s" repeatCount="indefinite"/><animate attributeName="cy" values="290;110;290" dur="14s" repeatCount="indefinite"/></circle>
    </g>
    <!-- fantasmas espelhados -->
    <g filter="url(#soft)" opacity=".5">
      <g fill="#ff3fb4"><path d="M170 340c0-70 20-105 60-120-22-14-32-38-30-64 3-36 30-58 62-58s59 22 62 58c2 26-8 50-30 64 40 15 60 50 60 120z"><animateTransform attributeName="transform" type="translate" values="0 0;14 -4;0 0" dur="7s" repeatCount="indefinite"/></path></g>
      <g fill="#2ff3e0" transform="translate(1200 0) scale(-1 1)"><path d="M170 340c0-70 20-105 60-120-22-14-32-38-30-64 3-36 30-58 62-58s59 22 62 58c2 26-8 50-30 64 40 15 60 50 60 120z"><animateTransform attributeName="transform" type="translate" values="0 0;14 -4;0 0" dur="8s" repeatCount="indefinite"/></path></g>
    </g>
    <!-- título com aberração cromática e glitch -->
    <g font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-weight="800" font-size="112" text-anchor="middle" letter-spacing="18">
      <text x="600" y="180" fill="#ff3fb4" opacity=".85">LILACS<animate attributeName="x" values="594;594;580;594;594" keyTimes="0;.86;.88;.9;1" dur="6s" repeatCount="indefinite"/></text>
      <text x="606" y="180" fill="#2ff3e0" opacity=".85">LILACS<animate attributeName="x" values="606;606;622;606;606" keyTimes="0;.86;.88;.9;1" dur="6s" repeatCount="indefinite"/></text>
      <text x="600" y="180" fill="#ffffff" filter="url(#glow)">LILACS</text>
    </g>
    <text x="600" y="232" text-anchor="middle" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="20" letter-spacing="6" fill="#efe6ff" opacity=".9">WALLPAPER ANIMADO  ✦  WALLPAPER ENGINE  &amp;  LIVELY</text>
    <text x="600" y="268" text-anchor="middle" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" letter-spacing="4" fill="#c9b8ff" opacity=".75">inspirado em Lilacs, de Pastel Ghost</text>
    <!-- equalizador -->
    <g fill="#ffffff" opacity=".8" transform="translate(586 290)">
      <rect x="0" width="4" rx="2" y="10" height="10"><animate attributeName="height" values="4;20;4" dur="1.1s" repeatCount="indefinite"/><animate attributeName="y" values="16;0;16" dur="1.1s" repeatCount="indefinite"/></rect>
      <rect x="8" width="4" rx="2" y="0" height="20"><animate attributeName="height" values="20;6;20" dur=".9s" repeatCount="indefinite"/><animate attributeName="y" values="0;14;0" dur=".9s" repeatCount="indefinite"/></rect>
      <rect x="16" width="4" rx="2" y="6" height="14"><animate attributeName="height" values="8;20;8" dur="1.3s" repeatCount="indefinite"/><animate attributeName="y" values="12;0;12" dur="1.3s" repeatCount="indefinite"/></rect>
      <rect x="24" width="4" rx="2" y="12" height="8"><animate attributeName="height" values="14;4;14" dur="1s" repeatCount="indefinite"/><animate attributeName="y" values="6;16;6" dur="1s" repeatCount="indefinite"/></rect>
    </g>
    <rect width="1200" height="340" fill="url(#scan)" opacity=".5"/>
    <rect width="1200" height="340" fill="url(#vig)"/>
  </g>
</svg>
