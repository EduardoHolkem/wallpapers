<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Daemon · Wallpaper</title>
  <style>
    *{box-sizing:border-box;margin:0;padding:0}
    html,body{height:100%}
    body{
      width:100vw;height:100vh;overflow:hidden;
      background:#2a0008;color:#fff;
      font-family:"Segoe UI",Inter,Arial,sans-serif;
    }
    .wallpaper{position:relative;width:100%;height:100%;overflow:hidden}
    /* 1u = 1px numa tela de 1280px de largura; o relógio acompanha a tela */
    :root{--u:clamp(.2px,.078125vw,2px);--s:1}  /* --s = escala do relógio, calculada no script */

    /* Fundo vermelho escuro, com as bordas um pouco mais fechadas */
    .bg{
      position:absolute;inset:0;z-index:1;
      background:radial-gradient(ellipse at center,rgba(0,0,0,0) 50%,rgba(0,0,0,.35) 100%),#2a0008;
    }

    /* Brilho de brasa atrás do Daemon. O degradê já é suave, então não precisa
       de filtro de desfoque; a animação mexe só em opacidade e escala. */
    .glow{
      position:absolute;top:50%;left:50%;z-index:2;
      width:80vmin;height:80vmin;margin:-40vmin 0 0 -40vmin;
      background:radial-gradient(circle,rgba(140,20,20,.36) 0%,rgba(140,20,20,.16) 35%,rgba(140,20,20,0) 70%);
      will-change:transform,opacity;
      animation:glow 5s ease-in-out infinite;
    }
    @keyframes glow{
      0%,100%{opacity:.6;transform:scale(1)}
      50%{opacity:1;transform:scale(1.1)}
    }

    /* Personagem, com uma respiração bem leve */
    .person{
      position:absolute;left:50%;bottom:-2vh;z-index:5;
      height:88vh;max-height:950px;
      transform:translateX(-50%);transform-origin:50% 100%;
      will-change:transform;
      animation:breathe 6s ease-in-out infinite;
    }
    @keyframes breathe{
      0%,100%{transform:translateX(-50%) scale(1)}
      50%{transform:translateX(-50%) scale(1.008)}
    }

    /* Brasas subindo na frente do Daemon */
    #embers{position:absolute;inset:0;width:100%;height:100%;z-index:8;pointer-events:none}

    .clock{
      position:absolute;top:calc(12*var(--u));left:calc(12*var(--u));z-index:12;
      color:#fff;text-shadow:0 0 7px rgba(0,0,0,.7);
      transform:scale(var(--s));transform-origin:0 0;
    }
    .clock .time{font-size:16px;font-weight:300;letter-spacing:.08em}
    .clock .date{font-size:7.3px;opacity:.8;margin-top:3px;letter-spacing:.06em;text-transform:lowercase}
    .hidden{display:none !important}
  </style>
</head>
<body>
  <div class="wallpaper">
    <div class="bg"></div>
    <div class="glow" id="glow"></div>
    <img src="Daemon.png" alt="Daemon Targaryen" class="person">
    <canvas id="embers"></canvas>
    <div class="clock" id="clock">
      <div class="time" id="clock-time">00:00:00</div>
      <div class="date" id="clock-date"></div>
    </div>
  </div>

  <script>
  /* ================= Configuração ================= */
  const CONFIG = {
    fps: 30,
    amount: 1,      // quantidade de brasas (1 = 120 brasas)
    scale: .5       // resolução do canvas das brasas em relação à tela
  };

  /* ================= Relógio ================= */
  const clockTime=document.getElementById('clock-time'), clockDate=document.getElementById('clock-date');
  const dateFmt=new Intl.DateTimeFormat('pt-BR',{day:'numeric',month:'long',year:'numeric'});
  const two=n=>String(n).padStart(2,'0');
  function updateClock(){
    const now=new Date();
    clockTime.textContent=two(now.getHours())+':'+two(now.getMinutes())+':'+two(now.getSeconds());
    clockDate.textContent=dateFmt.format(now);
  }
  setInterval(updateClock,1000);updateClock();

  /* ================= Brasas ================= */
  const canvas=document.getElementById('embers'), ctx=canvas.getContext('2d');
  let W=0,H=0,K=1,embers=[];   // K = px do canvas por px de uma tela 1920x1080

  // Cada tipo de brasa vira uma imagem pronta, com o brilho já desenhado.
  // Antes o brilho era um shadowBlur calculado em toda brasa a cada quadro,
  // que é uma das operações mais pesadas do canvas.
  function sprite(core,glow,coreSize){
    const s=48,c=document.createElement('canvas');c.width=c.height=s;
    const x=c.getContext('2d'),g=x.createRadialGradient(s/2,s/2,0,s/2,s/2,s/2);
    g.addColorStop(0,core);g.addColorStop(coreSize,core);
    g.addColorStop(Math.min(.99,coreSize+.08),glow);g.addColorStop(1,'rgba(0,0,0,0)');
    x.fillStyle=g;x.fillRect(0,0,s,s);return c;
  }
  const TYPES=[
    // brasa dourada, a mais brilhante
    {chance:.35,img:sprite('rgba(255,220,120,1)','rgba(255,200,100,.5)',.1),glow:8,alpha:[.75,.95]},
    // brasa vermelha
    {chance:.40,img:sprite('rgba(220,80,60,1)','rgba(220,80,60,.3)',.16),glow:5,alpha:[.45,.65]},
    // cinza escura, sem brilho
    {chance:.25,img:sprite('rgba(20,20,20,1)','rgba(20,20,20,.6)',.55),glow:1,alpha:[.2,.4]}
  ];
  function pickType(){
    let r=Math.random();
    for(const t of TYPES){if((r-=t.chance)<0)return t;}
    return TYPES[0];
  }
  function newEmber(anywhere){
    const k=K,t=pickType();
    return {
      t, x:Math.random()*W, y:anywhere?Math.random()*H:H+10*k,
      r:(Math.random()*1.2+.6)*k,             // raio do núcleo
      vy:(Math.random()*1.2+.6)*60*k,         // px por segundo, para cima
      vx:(Math.random()*.6-.3)*60*k,
      a:t.alpha[0]+Math.random()*(t.alpha[1]-t.alpha[0])
    };
  }
  function resize(){
    // o relógio é desenhado no tamanho de uma tela de 1280px e escalado inteiro,
    // para a fonte não esbarrar no tamanho mínimo do navegador numa tela pequena
    document.documentElement.style.setProperty('--s',Math.max(.2,Math.min(2,innerWidth/1280)).toFixed(4));
    W=canvas.width=Math.max(2,Math.round(innerWidth*CONFIG.scale));
    H=canvas.height=Math.max(2,Math.round(innerHeight*CONFIG.scale));
    // tamanho e velocidade seguem a tela; a quantidade fica igual, então o visual
    // é o mesmo num monitor grande ou numa tela pequena (Steam Deck, prévia do hub)
    K=CONFIG.scale*Math.min(innerWidth/1920,innerHeight/1080);
    const n=Math.round(120*CONFIG.amount);
    embers=Array.from({length:n},()=>newEmber(true));
  }

  let last=0;
  function loop(now){
    requestAnimationFrame(loop);
    if(now-last<1000/CONFIG.fps-1)return;
    const dt=Math.min(.1,(now-last)/1000||0);last=now;
    const k=K;
    ctx.clearRect(0,0,W,H);
    for(const e of embers){
      e.y-=e.vy*dt;e.x+=e.vx*dt;
      if(e.y<-10*k){Object.assign(e,newEmber(false));}
      // a brasa encolhe enquanto sobe, como se esfriasse
      const shrink=.3+.7*Math.max(0,Math.min(1,e.y/H));
      const size=(e.r*shrink+e.t.glow*k)*2;
      ctx.globalAlpha=e.a;
      ctx.drawImage(e.t.img,e.x-size/2,e.y-size/2,size,size);
    }
    ctx.globalAlpha=1;
  }

  /* ================= Configurações do Wallpaper Engine e do Lively ================= */
  window.wallpaperPropertyListener={
    applyUserProperties(p){
      if(p.showclock)document.getElementById('clock').classList.toggle('hidden',!p.showclock.value);
      if(p.glow)document.getElementById('glow').classList.toggle('hidden',!p.glow.value);
      if(p.fps)CONFIG.fps=Math.max(10,Math.min(60,p.fps.value));
      if(p.amount){CONFIG.amount=p.amount.value/100;resize();}
    }
  };
  window.livelyPropertyListener=(name,value)=>window.wallpaperPropertyListener.applyUserProperties({[name]:{value}});

  addEventListener('resize',resize);
  resize();
  requestAnimationFrame(loop);
  </script>
</body>
</html>
