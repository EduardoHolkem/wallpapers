<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Jon Snow · Wallpaper</title>
  <style>
    *{box-sizing:border-box;margin:0;padding:0}
    html,body{height:100%}
    body{
      width:100vw;height:100vh;overflow:hidden;
      background:#f0f0f0;color:#fff;
      font-family:"Segoe UI",Inter,Arial,sans-serif;
    }
    .wallpaper{position:relative;width:100%;height:100%;overflow:hidden}
    /* 1u = 1px numa tela de 1280px de largura; o relógio acompanha a tela */
    :root{--u:clamp(.2px,.078125vw,2px);--s:1}  /* --s = escala do relógio, calculada no script */

    /* Fundo claro de nevasca, com as bordas um pouco mais escuras */
    .bg{
      position:absolute;inset:0;z-index:1;
      background:radial-gradient(ellipse at center,rgba(0,0,0,0) 50%,rgba(0,0,0,.25) 100%),#f0f0f0;
    }

    /* Brilho azulado atrás do Jon. O degradê já é suave, então não precisa
       de filtro de desfoque; a animação mexe só em opacidade e escala. */
    .glow{
      position:absolute;top:50%;left:50%;z-index:2;
      width:80vmin;height:80vmin;margin:-40vmin 0 0 -40vmin;
      background:radial-gradient(circle,rgba(80,140,200,.28) 0%,rgba(80,140,200,.12) 35%,rgba(80,140,200,0) 70%);
      opacity:.8;will-change:transform,opacity;
    }

    /* Personagem, com uma respiração bem leve */
    .person{
      position:absolute;left:50%;bottom:-2vh;z-index:5;
      height:88vh;max-height:950px;
      transform:translateX(-50%);transform-origin:50% 100%;
      will-change:transform;
    }
    /* Modo leve: brilho e personagem ficam parados e entram na mesma camada
       do fundo. Sem placa de vídeo, cada camada animada a mais custa caro. */
    .lite .glow,.lite .person{will-change:auto}

    /* Neve na frente do Jon, desenhada em meia resolução */
    #snow{position:absolute;inset:0;width:100%;height:100%;z-index:8;pointer-events:none}

    .clock{
      position:absolute;top:calc(12*var(--u));left:calc(12*var(--u));z-index:12;
      color:#fff;text-shadow:0 0 7px rgba(0,0,0,.7);
      transform:scale(var(--s));transform-origin:0 0;
    }
    .clock .time{font-size:16px;font-weight:300;letter-spacing:.08em}
    .clock .date{font-size:7.3px;opacity:.8;margin-top:3px;letter-spacing:.06em;text-transform:lowercase}
    .hidden{display:none !important}

    /* Assinatura do criador, pequena no canto inferior direito. Como o relógio,
       é desenhada no tamanho de uma tela de 1280px e escalada com a tela. Em
       tela em pé (celular, prévia estreita) vira a versão curta do nome. */
    .sign{
      position:absolute;right:calc(10*var(--u));bottom:calc(8*var(--u));z-index:12;
      transform:scale(var(--s));transform-origin:100% 100%;
      font-size:8px;font-weight:400;letter-spacing:.08em;white-space:nowrap;line-height:1;
      color:rgba(28,40,58,.6);text-shadow:0 1px 2px rgba(255,255,255,.5);
      pointer-events:none;
    }
    .sign .short{display:none}
    @media (max-aspect-ratio:1/1){.sign .full{display:none}.sign .short{display:inline}}
    /* em pé, o canto fica sobre a capa escura do Jon: a assinatura fica clara */
    @media (max-aspect-ratio:1/1){.sign{color:rgba(255,255,255,.65);text-shadow:0 1px 2px rgba(0,0,0,.6)}}
  </style>
</head>
<body>
  <div class="wallpaper">
    <div class="bg"></div>
    <div class="glow" id="glow"></div>
    <img src="JonSnow.png" alt="Jon Snow" class="person">
    <canvas id="snow"></canvas>
    <div class="clock" id="clock">
      <div class="time" id="clock-time">00:00:00</div>
      <div class="date" id="clock-date"></div>
    </div>
    <div class="sign" id="sign"><span class="full">Eduardo da Silva Holkem</span><span class="short">Eduardo S. Holkem</span></div>
  </div>

  <script>
  /* ================= Configuração ================= */
  const CONFIG = {
    fps: 30,
    amount: 1,      // quantidade de neve (1 = 100 flocos)
    perf: 'auto',   // desempenho: auto, full (completo) ou lite (leve)
    scale: .5       // resolução do canvas da neve em relação à tela
  };

  /* ================= Relógio ================= */
  const clockTime=document.getElementById('clock-time'), clockDate=document.getElementById('clock-date');
  // data em português; a prévia do hub pode pedir inglês ou espanhol (?lang=en ou es)
  const LOCALE={en:'en-US',es:'es-ES'}[new URLSearchParams(location.search).get('lang')]||'pt-BR';
  const dateFmt=new Intl.DateTimeFormat(LOCALE,{day:'numeric',month:'long',year:'numeric'});
  const two=n=>String(n).padStart(2,'0');
  function updateClock(){
    const now=new Date();
    clockTime.textContent=two(now.getHours())+':'+two(now.getMinutes())+':'+two(now.getSeconds());
    clockDate.textContent=dateFmt.format(now);
  }
  setInterval(updateClock,1000);updateClock();

  /* ================= Neve ================= */
  const canvas=document.getElementById('snow'), ctx=canvas.getContext('2d');
  let W=0,H=0,K=1,flakes=[];   // K = px do canvas por px de uma tela 1920x1080

  // floco já pronto (círculo branco suave); desenhar uma imagem é bem mais
  // barato do que montar um arco com cor nova para cada floco a cada quadro
  const flake=(()=>{
    const s=16,c=document.createElement('canvas');c.width=c.height=s;
    const x=c.getContext('2d'),g=x.createRadialGradient(s/2,s/2,0,s/2,s/2,s/2);
    g.addColorStop(0,'rgba(255,255,255,1)');g.addColorStop(.55,'rgba(255,255,255,.9)');g.addColorStop(1,'rgba(255,255,255,0)');
    x.fillStyle=g;x.fillRect(0,0,s,s);return c;
  })();

  function newFlake(anywhere){
    const k=K;
    return {
      x:Math.random()*W, y:anywhere?Math.random()*H:-10*k,
      r:(Math.random()*3+1)*k*1.4,           // raio
      vy:(Math.random()*1.5+.5)*60*k,         // px por segundo
      vx:(Math.random()*.8-.4)*60*k,
      a:Math.random()*.6+.3                   // opacidade
    };
  }
  function resize(){
    // o relógio é desenhado no tamanho de uma tela de 1280px e escalado inteiro,
    // para a fonte não esbarrar no tamanho mínimo do navegador numa tela pequena
    document.documentElement.style.setProperty('--s',Math.max(.2,Math.min(2,innerWidth/1280)).toFixed(4));
    W=canvas.width=Math.max(2,Math.round(innerWidth*CONFIG.scale));
    H=canvas.height=Math.max(2,Math.round(innerHeight*CONFIG.scale));
    // tamanho e velocidade seguem a tela; a quantidade fica igual, então o visual
    // é o mesmo num monitor grande ou numa tela pequena (Steam Deck, prévia do hub)
    K=CONFIG.scale*Math.min(innerWidth/1920,innerHeight/1080);
    const n=Math.round(100*CONFIG.amount);
    flakes=Array.from({length:n},()=>newFlake(true));
  }

  /* ================= Desempenho =================
     Sem placa de vídeo (ou com ela bloqueada) o navegador monta a tela usando
     o processador. Aí cada camada animada e cada canvas esticado pesam muito.
     O modo leve deixa o brilho e a personagem parados na mesma camada do fundo
     e desenha o canvas no tamanho real da tela, sem esticar. No automático ele
     liga sozinho quando não há placa de vídeo ou quando o FPS não se sustenta. */
  const glowEl=document.getElementById('glow'), personEl=document.querySelector('.person');
  const SOFT=(()=>{
    try{
      const c=document.createElement('canvas'),g=c.getContext('webgl')||c.getContext('experimental-webgl');
      if(!g)return true;
      const d=g.getExtension('WEBGL_debug_renderer_info');
      const r=String(g.getParameter(d?d.UNMASKED_RENDERER_WEBGL:g.RENDERER));
      const l=g.getExtension('WEBGL_lose_context');if(l)l.loseContext();
      return /swiftshader|llvmpipe|softpipe|software|basic render/i.test(r);
    }catch(e){return true;}
  })();
  const URL_LITE=new URLSearchParams(location.search).get('leve');   // ?leve=1 força, ?leve=0 desliga
  let lite=false, slow=false, fpsCap=60;
  function applyPerf(){
    const on=CONFIG.perf==='lite'||(CONFIG.perf==='auto'&&(URL_LITE!=null?URL_LITE!=='0':SOFT||slow));
    if(CONFIG.perf!=='auto')fpsCap=60;
    if(on===lite&&W)return;
    lite=on;
    document.body.classList.toggle('lite',lite);
    glowEl.style.transform=personEl.style.transform=glowEl.style.opacity='';
    CONFIG.scale=lite?1:.5;
    resize();
  }
  // Conta os quadros de verdade. Se ficarem bem abaixo do FPS pedido por dois
  // trechos seguidos de 3 segundos, o automático alivia: primeiro liga o modo
  // leve e, se ainda faltar, baixa o FPS para 20.
  const watch={t0:0,n:0,prev:0,bad:0};
  function watchFrame(now){
    if(now-watch.prev>600)watch.t0=0;          // wallpaper pausado: recomeça a conta
    watch.prev=now;
    if(!watch.t0){watch.t0=now;watch.n=0;return;}
    watch.n++;
    if(now-watch.t0<3000)return;
    const fps=watch.n*1000/(now-watch.t0), want=Math.min(CONFIG.fps,fpsCap);
    window.__perf={fps:+fps.toFixed(1),lite,fpsCap};
    watch.t0=now;watch.n=0;
    if(fps>=want*.8){watch.bad=0;return;}
    if(++watch.bad<2||CONFIG.perf!=='auto')return;
    watch.bad=0;
    if(!lite){slow=true;applyPerf();}
    else if(fpsCap>20)fpsCap=20;
  }

  let last=0,prev=0;
  function loop(now){
    requestAnimationFrame(loop);
    // agenda o próximo quadro pela média: se o PC não chega ao dobro do limite,
    // ele não pula um quadro sim, um não (o que cortaria o FPS pela metade)
    const iv=1000/Math.min(CONFIG.fps,fpsCap);
    if(now<last+iv-1)return;
    last=Math.max(last+iv,now-iv);
    const dt=Math.min(.1,(now-prev)/1000||0);prev=now;
    watchFrame(now);
    if(!lite){
      // brilho pulsando (5 s) e respiração (6 s), no mesmo ritmo do FPS
      const t=now/1000, g=.5-.5*Math.cos(t*Math.PI*2/5), b=.5-.5*Math.cos(t*Math.PI*2/6);
      glowEl.style.opacity=(.6+.4*g).toFixed(3);
      glowEl.style.transform='scale('+(1+.1*g).toFixed(4)+')';
      personEl.style.transform='translateX(-50%) scale('+(1+.008*b).toFixed(5)+')';
    }
    ctx.clearRect(0,0,W,H);
    for(const f of flakes){
      f.y+=f.vy*dt;f.x+=f.vx*dt;
      if(f.y>H+10){Object.assign(f,newFlake(false));}
      ctx.globalAlpha=f.a;
      ctx.drawImage(flake,f.x-f.r,f.y-f.r,f.r*2,f.r*2);
    }
    ctx.globalAlpha=1;
  }

  /* ================= Configurações do Wallpaper Engine e do Lively ================= */
  window.wallpaperPropertyListener={
    applyUserProperties(p){
      if(p.showclock)document.getElementById('clock').classList.toggle('hidden',!p.showclock.value);
      if(p.signature)document.getElementById('sign').classList.toggle('hidden',!p.signature.value);
      if(p.glow)document.getElementById('glow').classList.toggle('hidden',!p.glow.value);
      if(p.fps)CONFIG.fps=Math.max(10,Math.min(60,p.fps.value));
      if(p.perf){
        const v=p.perf.value;
        CONFIG.perf=typeof v==='number'?(['auto','full','lite'][v]||'auto'):v;   // Lively manda o índice
        slow=false;applyPerf();
      }
      if(p.amount){CONFIG.amount=p.amount.value/100;resize();}
    }
  };
  window.livelyPropertyListener=(name,value)=>window.wallpaperPropertyListener.applyUserProperties({[name]:{value}});

  addEventListener('resize',resize);
  applyPerf();
  requestAnimationFrame(loop);
  </script>
</body>
</html>
