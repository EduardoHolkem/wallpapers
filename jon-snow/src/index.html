<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Jon Snow · Wallpaper</title>
  <style>
    *{box-sizing:border-box;margin:0;padding:0}
    html,body{height:100%}
    body{
      width:100vw;height:100vh;overflow:hidden;
      background:#f0f0f0;color:#fff;
      font-family:"Segoe UI",Inter,Arial,sans-serif;
    }
    .wallpaper{position:relative;width:100%;height:100%;overflow:hidden}
    /* 1u = 1px numa tela de 1280px de largura; o relógio acompanha a tela */
    :root{--u:clamp(.3px,.078125vw,2px)}

    /* Fundo claro de nevasca, com as bordas um pouco mais escuras */
    .bg{
      position:absolute;inset:0;z-index:1;
      background:radial-gradient(ellipse at center,rgba(0,0,0,0) 50%,rgba(0,0,0,.25) 100%),#f0f0f0;
    }

    /* Brilho azulado atrás do Jon. O degradê já é suave, então não precisa
       de filtro de desfoque; a animação mexe só em opacidade e escala. */
    .glow{
      position:absolute;top:50%;left:50%;z-index:2;
      width:80vmin;height:80vmin;margin:-40vmin 0 0 -40vmin;
      background:radial-gradient(circle,rgba(80,140,200,.28) 0%,rgba(80,140,200,.12) 35%,rgba(80,140,200,0) 70%);
      will-change:transform,opacity;
      animation:glow 5s ease-in-out infinite;
    }
    @keyframes glow{
      0%,100%{opacity:.6;transform:scale(1)}
      50%{opacity:1;transform:scale(1.1)}
    }

    /* Personagem, com uma respiração bem leve */
    .person{
      position:absolute;left:50%;bottom:-2vh;z-index:5;
      height:88vh;max-height:950px;
      transform:translateX(-50%);transform-origin:50% 100%;
      will-change:transform;
      animation:breathe 6s ease-in-out infinite;
    }
    @keyframes breathe{
      0%,100%{transform:translateX(-50%) scale(1)}
      50%{transform:translateX(-50%) scale(1.008)}
    }

    /* Neve na frente do Jon, desenhada em meia resolução */
    #snow{position:absolute;inset:0;width:100%;height:100%;z-index:8;pointer-events:none}

    .clock{
      position:absolute;top:calc(12*var(--u));left:calc(12*var(--u));z-index:12;
      color:#fff;text-shadow:0 0 calc(7*var(--u)) rgba(0,0,0,.7);
    }
    .clock .time{font-size:calc(16*var(--u));font-weight:300;letter-spacing:.08em}
    .clock .date{font-size:calc(7.3*var(--u));opacity:.8;margin-top:calc(3*var(--u));letter-spacing:.06em;text-transform:lowercase}
    .hidden{display:none !important}
  </style>
</head>
<body>
  <div class="wallpaper">
    <div class="bg"></div>
    <div class="glow" id="glow"></div>
    <img src="JonSnow.png" alt="Jon Snow" class="person">
    <canvas id="snow"></canvas>
    <div class="clock" id="clock">
      <div class="time" id="clock-time">00:00:00</div>
      <div class="date" id="clock-date"></div>
    </div>
  </div>

  <script>
  /* ================= Configuração ================= */
  const CONFIG = {
    fps: 30,
    amount: 1,      // quantidade de neve (1 = 100 flocos numa tela de 1920x1080)
    scale: .5       // resolução do canvas da neve em relação à tela
  };

  /* ================= Relógio ================= */
  const clockTime=document.getElementById('clock-time'), clockDate=document.getElementById('clock-date');
  const dateFmt=new Intl.DateTimeFormat('pt-BR',{day:'numeric',month:'long',year:'numeric'});
  const two=n=>String(n).padStart(2,'0');
  function updateClock(){
    const now=new Date();
    clockTime.textContent=two(now.getHours())+':'+two(now.getMinutes())+':'+two(now.getSeconds());
    clockDate.textContent=dateFmt.format(now);
  }
  setInterval(updateClock,1000);updateClock();

  /* ================= Neve ================= */
  const canvas=document.getElementById('snow'), ctx=canvas.getContext('2d');
  let W=0,H=0,flakes=[];

  // floco já pronto (círculo branco suave); desenhar uma imagem é bem mais
  // barato do que montar um arco com cor nova para cada floco a cada quadro
  const flake=(()=>{
    const s=16,c=document.createElement('canvas');c.width=c.height=s;
    const x=c.getContext('2d'),g=x.createRadialGradient(s/2,s/2,0,s/2,s/2,s/2);
    g.addColorStop(0,'rgba(255,255,255,1)');g.addColorStop(.55,'rgba(255,255,255,.9)');g.addColorStop(1,'rgba(255,255,255,0)');
    x.fillStyle=g;x.fillRect(0,0,s,s);return c;
  })();

  function newFlake(anywhere){
    const k=CONFIG.scale;
    return {
      x:Math.random()*W, y:anywhere?Math.random()*H:-10*k,
      r:(Math.random()*3+1)*k*1.4,           // raio
      vy:(Math.random()*1.5+.5)*60*k,         // px por segundo
      vx:(Math.random()*.8-.4)*60*k,
      a:Math.random()*.6+.3                   // opacidade
    };
  }
  function resize(){
    W=canvas.width=Math.max(2,Math.round(innerWidth*CONFIG.scale));
    H=canvas.height=Math.max(2,Math.round(innerHeight*CONFIG.scale));
    const n=Math.round(100*CONFIG.amount*(innerWidth*innerHeight)/(1920*1080));
    flakes=Array.from({length:n},()=>newFlake(true));
  }

  let last=0;
  function loop(now){
    requestAnimationFrame(loop);
    if(now-last<1000/CONFIG.fps-1)return;
    const dt=Math.min(.1,(now-last)/1000||0);last=now;
    ctx.clearRect(0,0,W,H);
    for(const f of flakes){
      f.y+=f.vy*dt;f.x+=f.vx*dt;
      if(f.y>H+10){Object.assign(f,newFlake(false));}
      ctx.globalAlpha=f.a;
      ctx.drawImage(flake,f.x-f.r,f.y-f.r,f.r*2,f.r*2);
    }
    ctx.globalAlpha=1;
  }

  /* ================= Configurações do Wallpaper Engine e do Lively ================= */
  window.wallpaperPropertyListener={
    applyUserProperties(p){
      if(p.showclock)document.getElementById('clock').classList.toggle('hidden',!p.showclock.value);
      if(p.glow)document.getElementById('glow').classList.toggle('hidden',!p.glow.value);
      if(p.fps)CONFIG.fps=Math.max(10,Math.min(60,p.fps.value));
      if(p.amount){CONFIG.amount=p.amount.value/100;resize();}
    }
  };
  window.livelyPropertyListener=(name,value)=>window.wallpaperPropertyListener.applyUserProperties({[name]:{value}});

  addEventListener('resize',resize);
  resize();
  requestAnimationFrame(loop);
  </script>
</body>
</html>
